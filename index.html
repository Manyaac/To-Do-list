<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List 🤖</h1>
        <div class="date-picker">
            <label for="date">Today's Date:</label>
            <input type="date" id="date" required>
        </div>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn"><i class="fas fa-robot"></i> Add Task</button>
        </div>
        <div class="todo-container">
            <div class="pending-tasks">
                <h2><i class="fas fa-list"></i> Pending Tasks</h2>
                <ul id="pendingList"></ul>
            </div>
            <div class="completed-tasks">
                <h2><i class="fas fa-check-circle"></i> Completed Tasks</h2>
                <ul id="completedList"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
